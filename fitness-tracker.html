<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سجل الحديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101113;
    --surface:#1a1c20;
    --surface2:#212429;
    --border:#2b2e34;
    --text:#f2f0e9;
    --text-dim:#93979f;
    --text-dim2:#5f636b;
    --accent:#c8f31d;
    --accent-dim:#8fae16;
    --danger:#ff5d5d;
    --blue:#5db3ff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  .num{font-family:'Oswald',sans-serif; font-weight:600; direction:ltr; unicode-bidi:isolate;}
  #root{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(78px + var(--safe-bottom));}

  /* Topbar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(16,17,19,0));
    padding:calc(16px + var(--safe-top)) 18px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:20px;height:20px;}
  .brand-title{font-weight:900;font-size:17px;letter-spacing:.2px;}
  .profile-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--surface2); border:1px solid var(--border);
    padding:7px 12px 7px 8px; border-radius:100px; cursor:pointer; max-width:150px;
  }
  .profile-pill span{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-avatar{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#101113;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}

  .page{padding:4px 18px 24px;}
  .page h1{font-size:20px;font-weight:900;margin:6px 0 16px;}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
  .card-title{font-size:13px;color:var(--text-dim);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--text-dim);font-size:12.5px;}

  /* Buttons */
  .btn{
    border:none; border-radius:12px; padding:12px 16px; font-family:'Tajawal',sans-serif;
    font-weight:800; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-accent{background:var(--accent); color:#101113;}
  .btn-outline{background:transparent;border:1.5px solid var(--border); color:var(--text);}
  .btn-ghost{background:var(--surface2); color:var(--text);}
  .btn-danger-ghost{background:rgba(255,93,93,0.1); color:var(--danger);}
  .btn-full{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:16px;height:16px;}

  /* Inputs */
  input[type=text], input[type=number], select, textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:'Tajawal',sans-serif; font-size:14px; font-weight:600;
  }
  input[type=number]{font-family:'Oswald',sans-serif; direction:ltr; text-align:right;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label{font-size:12px; color:var(--text-dim); font-weight:700; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .seg{display:flex; background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:3px; gap:3px;}
  .seg button{flex:1; border:none; background:transparent; color:var(--text-dim); padding:9px 4px; border-radius:8px; font-family:'Tajawal',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;}
  .seg button.active{background:var(--accent); color:#101113;}

  /* Progress bars */
  .pbar-track{height:9px; background:var(--surface2); border-radius:100px; overflow:hidden; border:1px solid var(--border);}
  .pbar-fill{height:100%; border-radius:100px; background:var(--accent); transition:width .4s;}
  .pbar-fill.red{background:var(--danger);}
  .pbar-fill.blue{background:var(--blue);}

  /* Bottom nav */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
    background:rgba(26,28,32,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--border);
    display:flex; padding:8px 6px calc(8px + var(--safe-bottom)); z-index:30;
  }
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--text-dim2); padding:6px 2px; cursor:pointer; font-family:'Tajawal',sans-serif;}
  .navbtn svg{width:21px;height:21px;}
  .navbtn span{font-size:10.5px; font-weight:700;}
  .navbtn.active{color:var(--accent);}

  /* Plate ring */
  .plate-wrap{display:flex; justify-content:center; padding:6px 0 2px;}
  .plate-center{position:absolute; top:50%;left:50%;transform:translate(-50%,-50%); text-align:center;}
  .plate-center .big{font-size:30px; font-weight:700; line-height:1;}
  .plate-center .lbl{font-size:11px; color:var(--text-dim); font-weight:700; margin-top:3px;}

  /* Grid stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-box{background:var(--surface2); border-radius:12px; padding:12px; border:1px solid var(--border);}
  .stat-box .v{font-size:19px; font-weight:700;}
  .stat-box .l{font-size:11px; color:var(--text-dim); font-weight:700; margin-top:2px;}

  /* Day / exercise cards */
  .day-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:12px; overflow:hidden;}
  .day-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer;}
  .day-head .name{font-weight:800; font-size:15px;}
  .day-head .count{font-size:11.5px; color:var(--text-dim); font-weight:700;}
  .day-body{padding:0 14px 14px;}
  .ex-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border-radius:11px; padding:10px 12px; margin-bottom:8px;}
  .ex-row .exname{font-weight:700; font-size:13.5px;}
  .ex-row .exmeta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .chev{transition:transform .2s;}
  .chev.open{transform:rotate(180deg);}

  .fab-add{width:100%; border:1.5px dashed var(--border); background:transparent; color:var(--text-dim); border-radius:12px; padding:12px; font-weight:700; font-size:13px; cursor:pointer; margin-top:4px;}

  .empty{text-align:center; padding:36px 10px; color:var(--text-dim);}
  .empty svg{width:44px;height:44px; opacity:.3; margin-bottom:10px;}
  .empty .t{font-weight:800; font-size:14.5px; color:var(--text); margin-bottom:4px;}
  .empty .s{font-size:12.5px;}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + var(--safe-bottom)); max-height:85vh; overflow-y:auto; animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:38px;height:4px;background:var(--border);border-radius:10px;margin:0 auto 14px;}
  .modal-title{font-weight:900; font-size:16px; margin-bottom:14px;}
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .modal-actions .btn{flex:1;}

  /* set logging rows */
  .set-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .set-row .setno{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
  .set-row input{text-align:center;}
  .set-row .x{color:var(--text-dim2); font-weight:700;}
  .last-hint{font-size:11px; color:var(--accent-dim); font-weight:700; margin-top:2px;}

  /* chart svg */
  .chart-wrap{width:100%; overflow:visible;}
  .chart-empty{text-align:center; padding:20px; color:var(--text-dim); font-size:12.5px;}

  /* streak flame row */
  .flame-row{display:flex; align-items:center; gap:6px;}
  .flame-row svg{width:18px;height:18px;}

  /* photos */
  .photo-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .photo-strip img{width:92px;height:122px;object-fit:cover;border-radius:12px;border:1px solid var(--border);flex-shrink:0;}
  .photo-strip .add-photo{width:92px;height:122px;border-radius:12px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);cursor:pointer;}
  .photo-date{font-size:9.5px;color:var(--text-dim);text-align:center;margin-top:3px;}
  .photo-item{flex-shrink:0;}

  /* pr list */
  .pr-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .pr-item:last-child{border-bottom:none;}
  .pr-item .exn{font-weight:700;font-size:13.5px;}
  .pr-item .prv{font-weight:700; color:var(--accent);}

  /* macro entry list */
  .meal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .meal-item:last-child{border-bottom:none;}
  .meal-item .mn{font-weight:700; font-size:13px;}
  .meal-item .mm{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .meal-item .del{color:var(--danger); background:none; border:none; cursor:pointer; padding:6px;}

  .link-btn{background:none;border:none;color:var(--blue);font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Tajawal',sans-serif;padding:0;}
  ::-webkit-scrollbar{display:none;}
  a{color:inherit;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===================== STORAGE HELPERS ===================== */
async function sget(key){ try{ const r = await window.storage.get(key,false); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sset(key,val){ try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ console.error('storage set failed',e); } }

/* ===================== APP STATE ===================== */
let STATE = {
  loaded:false,
  profiles: [],
  activeId: null,
  profileData: null,   // {name,height,weight,age,gender,activity,goal,targets,weeklyGoal,stepsGoal}
  program: null,        // {days:[{id,name,exercises:[{id,name,sets,reps,weight}]}]}
  activity: null,       // {workoutLogs:[],weightLogs:[],macroLogs:{},stepLogs:{},photos:[]}
  page: 'home',
  openDay: null,
  modal: null,
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ar-SA',{day:'numeric',month:'short'});
}

/* ===================== INIT / LOAD ===================== */
async function init(){
  let profiles = await sget('profiles-list');
  if(!profiles){ profiles = []; await sset('profiles-list', profiles); }
  STATE.profiles = profiles;

  let activeId = await sget('active-profile-id');
  if(!activeId && profiles.length){ activeId = profiles[0].id; await sset('active-profile-id', activeId); }

  if(!activeId){
    // no profiles yet -> show create screen
    STATE.loaded = true;
    STATE.activeId = null;
    render();
    return;
  }
  await loadProfile(activeId);
  STATE.loaded = true;
  render();
}

async function loadProfile(id){
  STATE.activeId = id;
  await sset('active-profile-id', id);
  let pd = await sget('profile-data-'+id);
  if(!pd){
    pd = {name:'', height:null, weight:null, age:null, gender:'male', activity:'moderate', goal:'maintain', targets:null, weeklyGoal:4, stepsGoal:8000};
  }
  let prog = await sget('program-'+id);
  if(!prog){ prog = {days:[]}; }
  let act = await sget('activity-'+id);
  if(!act){ act = {workoutLogs:[], weightLogs:[], macroLogs:{}, stepLogs:{}, photos:[]}; }
  STATE.profileData = pd;
  STATE.program = prog;
  STATE.activity = act;
  STATE.page = 'home';
  STATE.openDay = null;
}

async function saveProfileData(){ await sset('profile-data-'+STATE.activeId, STATE.profileData); }
async function saveProgram(){ await sset('program-'+STATE.activeId, STATE.program); }
async function saveActivity(){ await sset('activity-'+STATE.activeId, STATE.activity); }

/* ===================== ICONS ===================== */
const ICONS = {
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>`,
  program:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6.5 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM6.5 20.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM6.5 17.5h11M6.5 13h11M6.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>`,
  log:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  progress:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.1-2.8-2.8L7 14"/></svg>`,
  macros:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 4 8 4 8h6s4-3 4-8a7 7 0 0 0-7-7z"/><path d="M12 2c-1 2-1 3.5 0 5"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m-9 0v14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6"/></svg>`,
  edit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
  chev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
  flame:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a2 2 0 0 0 4 0c1 1 2 2.5 2 4.5A5.5 5.5 0 0 1 6.5 18C6.5 12 12 10 12 2z"/></svg>`,
  camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  user:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,
  footprints:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M13 21v-2a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>`,
};

/* ===================== PLATE PROGRESS RING (signature element) ===================== */
function plateRing(pct, size, color, centerBig, centerLbl){
  pct = Math.max(0, Math.min(100, pct));
  const r = size/2 - 10;
  const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  const cx = size/2, cy = size/2;
  let bolts = '';
  for(let i=0;i<8;i++){
    const a = (i/8)*2*Math.PI;
    const bx = cx + (r-14)*Math.cos(a);
    const by = cy + (r-14)*Math.sin(a);
    bolts += `<circle cx="${bx}" cy="${by}" r="2.3" fill="#3a3d43"/>`;
  }
  return `
  <div style="position:relative;width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#24272c" stroke-width="11"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      ${bolts}
      <circle cx="${cx}" cy="${cy}" r="${r-24}" fill="none" stroke="#24272c" stroke-width="2"/>
    </svg>
    <div class="plate-center"><div class="big num">${centerBig}</div><div class="lbl">${centerLbl}</div></div>
  </div>`;
}

/* ===================== SVG LINE CHART ===================== */
function lineChart(points, opts={}){
  if(!points || points.length<2) return `<div class="chart-empty">أضف نقطتين على الأقل عشان يظهر الرسم</div>`;
  const w=480,h=150,pad=28;
  const vals = points.map(p=>p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min-=1; max+=1; }
  const stepX = (w-pad*2)/(points.length-1);
  const y = v => h-pad - ((v-min)/(max-min))*(h-pad*2);
  const pts = points.map((p,i)=>[pad+i*stepX, y(p.v)]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${opts.color||'#c8f31d'}"/>`).join('');
  const last = points[points.length-1];
  const first = points[0];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <defs><linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${opts.color||'#c8f31d'}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${opts.color||'#c8f31d'}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#grad1)"/>
    <path d="${path}" fill="none" stroke="${opts.color||'#c8f31d'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="${h-8}" fill="#93979f" font-size="10" font-family="Tajawal">${fmtDate(first.d)}</text>
    <text x="${w-pad}" y="${h-8}" fill="#93979f" font-size="10" font-family="Tajawal" text-anchor="end">${fmtDate(last.d)}</text>
  </svg></div>`;
}
function barChart(points, opts={}){
  if(!points || points.length===0) return `<div class="chart-empty">سجل تمرين وحصل بيانات الحجم هنا</div>`;
  const w=480,h=150,pad=26;
  const max = Math.max(...points.map(p=>p.v), 1);
  const bw = (w-pad*2)/points.length*0.6;
  const gap = (w-pad*2)/points.length;
  const bars = points.map((p,i)=>{
    const bh = (p.v/max)*(h-pad*2);
    const x = pad + i*gap + (gap-bw)/2;
    const y = h-pad-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${opts.color||'#5db3ff'}"/>`;
  }).join('');
  const first = points[0], last = points[points.length-1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${bars}
    <text x="${pad}" y="${h-6}" fill="#93979f" font-size="10" font-family="Tajawal">${fmtDate(first.d)}</text>
    <text x="${w-pad}" y="${h-6}" fill="#93979f" font-size="10" font-family="Tajawal" text-anchor="end">${fmtDate(last.d)}</text>
  </svg></div>`;
}

/* ===================== CALC HELPERS ===================== */
const ACT_MULT = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryactive:1.9};
const ACT_LABEL = {sedentary:'خامل (بدون رياضة)', light:'نشاط خفيف (1-3 أيام)', moderate:'نشاط متوسط (3-5 أيام)', active:'نشاط عالي (6-7 أيام)', veryactive:'نشاط عالي جدًا (رياضي/شغل جسدي)'};
const GOAL_LABEL = {cut:'تنشيف / نزول وزن', maintain:'ثبات الوزن', bulk:'زيادة / تضخيم'};

function calcTargets(pd){
  if(!pd.height || !pd.weight || !pd.age) return null;
  let bmr;
  if(pd.gender==='male') bmr = 10*pd.weight + 6.25*pd.height - 5*pd.age + 5;
  else bmr = 10*pd.weight + 6.25*pd.height - 5*pd.age - 161;
  let tdee = bmr * (ACT_MULT[pd.activity]||1.2);
  let cals = tdee;
  if(pd.goal==='cut') cals = tdee*0.8;
  if(pd.goal==='bulk') cals = tdee*1.1;
  const protein = pd.weight*1.8;
  const fat = (cals*0.25)/9;
  const carbs = (cals - protein*4 - fat*9)/4;
  return {
    calories:Math.round(cals), protein:Math.round(protein),
    fat:Math.round(fat), carbs:Math.round(Math.max(0,carbs)), bmr:Math.round(bmr), tdee:Math.round(tdee)
  };
}

function lastLiftFor(exName){
  const logs = STATE.activity.workoutLogs.slice().reverse();
  for(const l of logs){
    const ex = l.exercises.find(e=>e.name===exName);
    if(ex && ex.sets.length){
      const best = ex.sets.reduce((a,b)=> (b.weight>a.weight?b:a), ex.sets[0]);
      return {date:l.date, weight:best.weight, reps:best.reps};
    }
  }
  return null;
}
function allTimePRs(){
  const map = {};
  STATE.activity.workoutLogs.forEach(l=>{
    l.exercises.forEach(ex=>{
      ex.sets.forEach(s=>{
        if(!map[ex.name] || s.weight > map[ex.name].weight){
          map[ex.name] = {weight:s.weight, reps:s.reps, date:l.date};
        }
      });
    });
  });
  return Object.entries(map).map(([name,v])=>({name,...v})).sort((a,b)=>b.weight-a.weight);
}
function volumeSeries(){
  return STATE.activity.workoutLogs.map(l=>{
    let vol = 0;
    l.exercises.forEach(ex=> ex.sets.forEach(s=> vol += (s.weight||0)*(s.reps||0)));
    return {d:l.date, v:vol};
  });
}
function weeklySessionCount(){
  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7*86400000);
  return STATE.activity.workoutLogs.filter(l=> new Date(l.date+'T00:00:00') > weekAgo).length;
}
function currentStreak(){
  const dates = new Set(STATE.activity.workoutLogs.map(l=>l.date));
  let streak = 0;
  let d = new Date();
  // if no workout today yet, start checking from yesterday
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(dates.has(ds)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function todayMacroTotals(){
  const entries = STATE.activity.macroLogs[todayStr()] || [];
  return entries.reduce((a,e)=>({
    calories:a.calories+(e.calories||0), protein:a.protein+(e.protein||0),
    carbs:a.carbs+(e.carbs||0), fat:a.fat+(e.fat||0)
  }), {calories:0,protein:0,carbs:0,fat:0});
}

  else if(type==='editMacroProfile') body = modalMacroProfile();
  else if(type==='switchProfile') body = modalSwitchProfile();

  return `<div class="modal-bg" id="modalBg"><div class="modal-sheet">${body}</div></div>`;
}

/* ===================== ATTACH EVENTS ===================== */
function attachGlobal(){
  // nav
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ STATE.page = el.getAttribute('data-nav'); LOGDRAFT = (STATE.page==='log')?LOGDRAFT:LOGDRAFT; render(); };
  });
  on('profilePill', ()=> openModal('switchProfile'));

  // HOME
  on('editSteps', ()=>{ STATE.page='macros'; render(); });

  // PROGRAM
  on('addDayBtn', ()=> openModal('addDay'));
  document.querySelectorAll('[data-toggleday]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target.closest('[data-delday]')) return; const id = el.getAttribute('data-toggleday'); STATE.openDay = STATE.openDay===id?null:id; render(); };
  });
  document.querySelectorAll('[data-delday]').forEach(el=>{
    el.onclick=async (e)=>{ e.stopPropagation(); const id = el.getAttribute('data-delday'); STATE.program.days = STATE.program.days.filter(d=>d.id!==id); await saveProgram(); render(); };
  });
  document.querySelectorAll('[data-addex]').forEach(el=>{
    el.onclick=()=> openModal('addEx', {dayId: el.getAttribute('data-addex')});
  });
  document.querySelectorAll('[data-editex]').forEach(el=>{
    el.onclick=()=>{
      const [dayId, exId] = el.getAttribute('data-editex').split(':');
      const day = STATE.program.days.find(d=>d.id===dayId);
      const ex = day.exercises.find(x=>x.id===exId);
      openModal('editEx', {dayId, ex});
    };
  });
  document.querySelectorAll('[data-delex]').forEach(el=>{
    el.onclick=async ()=>{
      const [dayId, exId] = el.getAttribute('data-delex').split(':');
      const day = STATE.program.days.find(d=>d.id===dayId);
      day.exercises = day.exercises.filter(x=>x.id!==exId);
      await saveProgram(); render();
    };
  });

  // LOG
  document.querySelectorAll('[data-startlog]').forEach(el=>{
    el.onclick=()=>{
      const dayId = el.getAttribute('data-startlog');
      const day = STATE.program.days.find(d=>d.id===dayId);
      LOGDRAFT = { dayId, exercises: day.exercises.map(ex=>({
        name: ex.name, targetSets: ex.sets, targetReps: ex.reps,
        sets: Array.from({length: ex.sets}, ()=>({weight: ex.weight||null, reps: ex.reps||null}))
      }))};
      render();
    };
  });
  on('cancelLog', ()=>{ LOGDRAFT=null; render(); });
  on('finishLog', async ()=>{
    const day = STATE.program.days.find(d=>d.id===LOGDRAFT.dayId);
    const cleanEx = LOGDRAFT.exercises.map(ex=>({
      name: ex.name,
      sets: ex.sets.filter(s=> s.weight!=null && s.reps!=null && s.weight!=='' && s.reps!=='').map(s=>({weight:parseFloat(s.weight), reps:parseInt(s.reps)}))
    })).filter(ex=>ex.sets.length>0);
    if(cleanEx.length===0){ alert('سجل وزن وعدات لسِت واحد على الأقل'); return; }
    STATE.activity.workoutLogs.push({date: todayStr(), dayName: day.name, exercises: cleanEx});
    await saveActivity();
    LOGDRAFT = null;
    STATE.page = 'home';
    render();
  });
  document.querySelectorAll('[data-setw]').forEach(el=>{
    el.oninput=()=>{ const [exi,si]=el.getAttribute('data-setw').split(':').map(Number); LOGDRAFT.exercises[exi].sets[si].weight = el.value; };
  });
  document.querySelectorAll('[data-setr]').forEach(el=>{
    el.oninput=()=>{ const [exi,si]=el.getAttribute('data-setr').split(':').map(Number); LOGDRAFT.exercises[exi].sets[si].reps = el.value; };
  });
  document.querySelectorAll('[data-addset]').forEach(el=>{
    el.onclick=()=>{ const exi = Number(el.getAttribute('data-addset')); LOGDRAFT.exercises[exi].sets.push({weight:null,reps:null}); render(); };
  });
  document.querySelectorAll('[data-delset]').forEach(el=>{
    el.onclick=()=>{ const [exi,si]=el.getAttribute('data-delset').split(':').map(Number); LOGDRAFT.exercises[exi].sets.splice(si,1); render(); };
  });

  // PROGRESS
  on('addWeightBtn', ()=> openModal('addWeight'));
  on('addPhotoBtn', ()=> document.getElementById('photoInput').click());
  const photoInput = document.getElementById('photoInput');
  if(photoInput) photoInput.onchange = handlePhotoUpload;

  // MACROS
  on('editMacroProfile', ()=> openModal('editMacroProfile'));
  on('editMacroProfile2', ()=> openModal('editMacroProfile'));
  on('addMealBtn', ()=> openModal('addMeal'));
  document.querySelectorAll('[data-delmeal]').forEach(el=>{
    el.onclick=async ()=>{
      const i = Number(el.getAttribute('data-delmeal'));
      STATE.activity.macroLogs[todayStr()].splice(i,1);
      await saveActivity(); render();
    };
  });
  on('saveSteps', async ()=>{
    const v = parseInt(document.getElementById('stepsInput').value)||0;
    STATE.activity.stepLogs[todayStr()] = v;
    await saveActivity(); render();
  });

  // MODAL generic
  const bg = document.getElementById('modalBg');
  if(bg) bg.onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
  on('mCancel', closeModal);

  on('mSaveDay', async ()=>{
    const name = document.getElementById('mDayName').value.trim();
    if(!name) return;
    STATE.program.days.push({id:uid(), name, exercises:[]});
    await saveProgram(); closeModal();
  });

  on('mSaveEx', async (e)=>{
    const btn = document.getElementById('mSaveEx');
    const dayId = btn.getAttribute('data-dayid');
    const exId = btn.getAttribute('data-exid');
    const name = document.getElementById('mExName').value.trim();
    const sets = parseInt(document.getElementById('mExSets').value)||3;
    const reps = parseInt(document.getElementById('mExReps').value)||10;
    const weight = document.getElementById('mExWeight').value;
    if(!name) return;
    const day = STATE.program.days.find(d=>d.id===dayId);
    if(exId){
      const ex = day.exercises.find(x=>x.id===exId);
      Object.assign(ex, {name, sets, reps, weight: weight?parseFloat(weight):null});
    } else {
      day.exercises.push({id:uid(), name, sets, reps, weight: weight?parseFloat(weight):null});
    }
    await saveProgram(); closeModal();
  });

  on('mSaveWeight', async ()=>{
    const v = parseFloat(document.getElementById('mWeightVal').value);
    if(!v) return;
    STATE.activity.weightLogs.push({date: todayStr(), weight: v});
    STATE.profileData.weight = v;
    await saveActivity(); await saveProfileData(); closeModal();
  });

  on('mSaveMeal', async ()=>{
    const name = document.getElementById('mMealName').value.trim();
    const calories = parseFloat(document.getElementById('mMealCal').value)||0;
    const protein = parseFloat(document.getElementById('mMealP').value)||0;
    const carbs = parseFloat(document.getElementById('mMealC').value)||0;
    const fat = parseFloat(document.getElementById('mMealF').value)||0;
    if(!calories && !protein && !carbs && !fat) return;
    const key = todayStr();
    if(!STATE.activity.macroLogs[key]) STATE.activity.macroLogs[key]=[];
    STATE.activity.macroLogs[key].push({name,calories,protein,carbs,fat});
    await saveActivity(); closeModal();
  });

  document.querySelectorAll('[data-gender]').forEach(el=>{
    el.onclick=()=>{ document.querySelectorAll('[data-gender]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); el.dataset.selected='1'; };
  });
  document.querySelectorAll('[data-goal]').forEach(el=>{
    el.onclick=()=>{ document.querySelectorAll('[data-goal]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); };
  });
  on('mSaveMacroProfile', async ()=>{
    const pd = STATE.profileData;
    pd.height = parseFloat(document.getElementById('mHeight').value)||null;
    pd.weight = parseFloat(document.getElementById('mWeight').value)||null;
    pd.age = parseInt(document.getElementById('mAge').value)||null;
    const genderBtn = document.querySelector('[data-gender].active');
    pd.gender = genderBtn ? genderBtn.getAttribute('data-gender') : pd.gender;
    pd.activity = document.getElementById('mActivity').value;
    const goalBtn = document.querySelector('[data-goal].active');
    pd.goal = goalBtn ? goalBtn.getAttribute('data-goal') : pd.goal;
    pd.weeklyGoal = parseInt(document.getElementById('mWeeklyGoal').value)||4;
    pd.stepsGoal = parseInt(document.getElementById('mStepsGoal').value)||8000;
    pd.targets = calcTargets(pd);
    await saveProfileData(); closeModal();
  });

  // profile switch modal
  document.querySelectorAll('[data-selectprofile]').forEach(el=>{
    el.onclick=async ()=>{ const id = el.getAttribute('data-selectprofile'); await loadProfile(id); closeModal(); };
  });
  on('mNewProfile', ()=>{ document.getElementById('newProfileField').style.display='block'; });
  on('mCreateProfile', async ()=>{
    const name = document.getElementById('mNewProfileName').value.trim();
    if(!name) return;
    const id = uid();
    STATE.profiles.push({id,name});
    await sset('profiles-list', STATE.profiles);
    await loadProfile(id);
    STATE.profileData.name = name;
    await saveProfileData();
    closeModal();
  });
}

/* ===================== PHOTO UPLOAD (resize client-side) ===================== */
function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxW = 640;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
      STATE.activity.photos.push({id:uid(), date: todayStr(), dataUrl});
      if(STATE.activity.photos.length>16) STATE.activity.photos.shift();
      await saveActivity();
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

init();
</script>
